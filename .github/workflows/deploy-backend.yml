name: Build & Release Backend

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'erp-backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 🔨 Build with Maven
        run: |
          cd erp-backend
          mvn clean package -DskipTests

      - name: 🚀 Publish Latest Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Backend Build
          body: Automated Spring Boot build from GitHub Actions
          files: erp-backend/target/erp-backend-0.0.1-SNAPSHOT.jar
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
