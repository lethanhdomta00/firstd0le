spring:
  application:
    name: erp-backend
  config:
    import: optional:classpath:gemini-keys.yml
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/erp_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 8000
          timeout: 8000
          writetimeout: 8000

server:
  address: 0.0.0.0
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 86400000 # 24 hours

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:jky0vgcg}
  api-key: ${CLOUDINARY_API_KEY:246986112431434}
  api-secret: ${CLOUDINARY_API_SECRET:KjR_XssmdSoq59O_Poa9WlUgnCw}

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  default-chat-id: ${TELEGRAM_DEFAULT_CHAT_ID:}

gemini:
  # Danh sách API Keys được nạp tự động từ file gemini-keys.yml (hoặc biến môi trường GEMINI_API_KEYS)
  model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
  api-url: https://generativelanguage.googleapis.com/v1beta/models
